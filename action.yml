name: "Automated Repo Article Generator"
description: "Scans public repositories, generates blog posts using Ollama Cloud, and writes them to a directory."
inputs:
  github-token:
    description: "The GITHUB_TOKEN used to read and fetch repo contents"
    required: true
    default: ${{ github.token }}
  ollama-api-key:
    description: "The API key for authentication with the Ollama Cloud platform"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Run Article Generation Script
      run: node runner.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OLLAMA_API_KEY: ${{ inputs.ollama-api-key }}
        # Pass the caller repository tracking context
        GITHUB_REPOSITORY: ${{ github.repository }}
        # Pass the explicit workspace root path to Node
        USER_WORKSPACE: ${{ github.workspace }}

    - name: Configure Git Credentials
      run: |
        git config --local user.name "${{ github.actor }}"
        git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@://github.com"
      shell: bash

    - name: Commit and Push Changes
      run: |
        git add _posts/ || true
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update repo analysis posts"
          git push
        fi
      shell: bash
